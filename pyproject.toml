[project]
name = "ai-rag-service"
version = "0.1.0"
description = "Python AI service for RAG-based enterprise document Q&A"
requires-python = ">=3.10"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "langchain>=0.3",
    "langchain-community>=0.3",
    "langchain-huggingface>=0.1",
    "chromadb>=0.6",
    "pypdf>=5",
    "python-docx>=1.1",
    "docx2txt>=0.9",
    "mammoth>=1.8",
    "pywin32>=311",
    "python-multipart>=0.0",
    "pydantic-settings>=2.7",
    "aiohttp>=3.11",
    "httpx>=0.27",
    "pyyaml>=6.0",
    # LangChain integrations
    "openpyxl>=3.1",
    "langchain-chroma>=0.2",
    "langchain-openai>=0.3",
    "langchain-ollama>=0.3",
    # RabbitMQ & MinIO
    "pika>=1.3",
    "minio>=7.0",
    "redis>=5.0",
    # MCP (2.0 移除了 FastMCP，需锁定 1.x)
    "mcp>=1.0,<2.0",
    # 分词
    "jieba>=0.42",
    # 图表生成
    "matplotlib>=3.8",
]

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
